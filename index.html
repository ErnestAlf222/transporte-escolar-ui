<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Transporte Escolar</title>
    <script>
      // Aplica el tema guardado antes de que cargue la página, para que no parpadee
      ;(function () {
        var guardado = null
        try {
          guardado = localStorage.getItem('tema')
        } catch (e) {}
        document.documentElement.dataset.theme = guardado === 'light' ? 'light' : 'dark'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
